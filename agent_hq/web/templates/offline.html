{% extends "base.html" %}

{% block title %}Offline — Agent HQ{% endblock %}

{% block body %}
<main class="offline-shell" style="
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 2rem;
    text-align: center; font-family: system-ui, sans-serif;
    color: #e6edf3; background: #0a0c0d;">
  <h1 style="font-size: 1.5rem; margin: 0 0 0.5rem;">No connection</h1>
  <p style="margin: 0 0 1.5rem; opacity: 0.7;">
    Agent HQ can't reach your Mac. Check that Tailscale is up and the service
    is running, then retry.
  </p>
  <button type="button" onclick="location.reload()" style="
      padding: 0.6rem 1.2rem; border-radius: 6px; border: 1px solid #30363d;
      background: #21262d; color: inherit; font-size: 1rem; cursor: pointer;">
    Retry
  </button>
</main>
{% endblock %}
