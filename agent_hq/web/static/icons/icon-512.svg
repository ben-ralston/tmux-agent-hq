<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="106" fill="#0e1116"/>
  <g fill="#7ee787">
    <!-- H: bars 42 wide, height 220 (y=146 to y=366), total width 148 -->
    <rect x="68"  y="146" width="42" height="220" rx="8"/>
    <rect x="174" y="146" width="42" height="220" rx="8"/>
    <rect x="68"  y="235" width="148" height="42" rx="8"/>
    <!-- Q: r=89 + stroke 42 → outer height 220, matches H. cx=326 so outer-left
         kisses H's right bar at x=216. -->
    <circle cx="326" cy="256" r="89" fill="none" stroke="#7ee787" stroke-width="42"/>
    <!-- Q tail: stroke center starts on circle path at 50°, extends 60 units
         outward; rounded cap fuses it into the circle stroke. -->
    <line x1="383" y1="324" x2="422" y2="370" stroke="#7ee787" stroke-width="42" stroke-linecap="round"/>
  </g>
</svg>
